[package]
name = "eplayer"
version = "1.1.1"
edition = "2021"
description = "Portable local music player for Windows"

[dependencies]
anyhow = "1"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
cpal = "0.16"
symphonia = { version = "0.5.5", features = ["all"] }
crossbeam-channel = "0.5"
ringbuf = "0.4"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
encoding_rs = "0.8"
rand = "0.9"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
tray-icon = "0.21"
global-hotkey = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
eframe = { path = "vendor/eframe" }


[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

